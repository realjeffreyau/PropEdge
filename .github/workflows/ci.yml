name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      # These values are CI-only placeholders. No database service or paid
      # provider account is required for the checks or production build.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/propedge
      AUTH_SECRET: ci-only-auth-secret
      AUTH_URL: ""
      AUTH_TRUST_HOST: ""
      APP_BASE_URL: ""
      THE_ODDS_API_KEY: ""
      ODDS_API_REGION: us
      ODDS_API_BOOKMAKERS: draftkings,fanduel,betmgm,williamhill_us,espnbet,fanatics
      ODDS_API_DFS_BOOKMAKERS: underdog,prizepicks,pick6,betr_us_dfs
      ADMIN_EMAIL: ci@example.invalid
      ADMIN_PASSWORD: ci-only-password

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
